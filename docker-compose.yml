version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    container_name: intelligent_web
    command: bash -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    env_file:
      - ./env/.env.docker
    ports:
      - "8000:8000"
    depends_on:
      - mysql
      - redis

  worker:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    container_name: intelligent_worker
    command: celery -A config worker -l info
    volumes:
      - .:/app
    env_file:
      - ./env/.env.docker
    depends_on:
      - web
      - redis
      - mysql

  beat:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    container_name: intelligent_beat
    command: celery -A config beat -l info
    volumes:
      - .:/app
    env_file:
      - ./env/.env.docker
    depends_on:
      - worker
      - mysql
      - redis

  redis:
    image: redis:7-alpine
    container_name: intelligent_redis
    ports:
      - "6379:6379"

  mysql:
    image: mysql:8
    container_name: intelligent_mysql
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: intelligent_platform
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
